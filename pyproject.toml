[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cardano-blaster"
version = "0.1.0"
description = "Check compiled Plutus blueprints and assurance with a pinned Blaster runtime"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
cardano-blaster = "cardano_blaster.cli:main"

[tool.setuptools]
packages = ["cardano_blaster"]

[tool.setuptools.package-data]
cardano_blaster = ["runtime/*"]
