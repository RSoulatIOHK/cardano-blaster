name: CLI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-wheel
          path: dist/*.whl

  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARDANO_BLASTER_CACHE: ${{ github.workspace }}/.runtime-cache
      CARDANO_BLASTER_TEST_OUTPUT: ${{ github.workspace }}/cardano-blaster-results/integration
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: cardano_blaster/runtime
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Install wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m pip install dist/*.whl
      - name: Prepare pinned runtime from fresh downloads
        run: cardano-blaster setup
      - name: Check compiled examples and replay counterexamples
        run: python tests/integration.py
      - name: Preserve verification evidence and setup diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-${{ matrix.os }}
          path: |
            cardano-blaster-results/
            .runtime-cache/**/setup.log
