name: Native Lean CLI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-blaster/package-lock.json
      - name: Match the VSIX version to the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: vscode-blaster
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - name: Test and package the VS Code extension
        run: |
          npm ci --prefix vscode-blaster
          npm test --prefix vscode-blaster
          npm run package --prefix vscode-blaster
          unzip -t vscode-blaster/*.vsix
      - name: Upload installable VSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blaster-assurance-vsix
          retention-days: 7
          path: vscode-blaster/*.vsix

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Build native Lean executables
        run: lake build cardano-blaster native-tests
      - name: Check macOS deployment target
        if: runner.os == 'macOS'
        run: test "$(otool -l .lake/build/bin/cardano-blaster | awk '$1 == "minos" { print $2; exit }')" = '14.0'
      - name: Install locked solver and check metadata/report behavior
        run: |
          lake exe cardano-blaster setup
          lake exe native-tests unit
          lake env lean .lake/packages/PlutusCore/Tests/BlueprintVerify/Hashing.lean
      - name: Build and relocate native distribution
        run: |
          lake exe cardano-blaster bundle dist/cardano-blaster
          mkdir -p relocated
          mv dist/cardano-blaster relocated/cardano-blaster
      - name: Verify, replay and export Haskell with development tools blocked
        run: lake exe native-tests integration "$PWD/relocated/cardano-blaster/bin/cardano-blaster" "$PWD/examples" "$PWD/cardano-blaster-results/integration"
      - name: Package standalone archive
        run: tar -C relocated -czf dist/cardano-blaster-${{ matrix.platform }}.tar.gz cardano-blaster
      - name: Hash release archive
        working-directory: dist
        run: shasum -a 256 cardano-blaster-${{ matrix.platform }}.tar.gz > cardano-blaster-${{ matrix.platform }}.tar.gz.sha256
      - name: Upload native distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cardano-blaster-${{ matrix.platform }}
          retention-days: 7
          path: |
            dist/*.tar.gz
            dist/*.sha256
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-${{ matrix.platform }}
          retention-days: 7
          path: cardano-blaster-results/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, extension]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: cardano-blaster-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: blaster-assurance-vsix
          path: release
      - name: Publish tested native archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/*.sha256 release/*.vsix \
            --verify-tag --title "cardano-blaster $GITHUB_REF_NAME" --generate-notes
